<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>gkill autolog の設定</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 40rem;
        line-height: 1.7;
      }
      label {
        display: block;
        margin-top: 1.2rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        box-sizing: border-box;
      }
      p.hint {
        margin: 0.3rem 0 0;
        font-size: 0.9rem;
        color: #555;
      }
      code {
        background: #f2f2f2;
        padding: 0.1rem 0.3rem;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1.5rem;
      }
      #status {
        margin-left: 1rem;
      }
      #queue {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #ddd;
        font-size: 0.9rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>gkill autolog の設定</h1>

    <label for="endpoint">送信先</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:19921/ingest" />
    <p class="hint">
      <code>autolog collect</code> が待ち受けているアドレス。既定のままでよい。
    </p>

    <label for="token">共有トークン</label>
    <input id="token" type="text" placeholder="autolog collect が生成したトークン" />
    <p class="hint">
      <code>autolog collect</code> を初めて起動すると
      <code>%LOCALAPPDATA%\gkill_autolog\ingest_token.txt</code>
      に生成される。その中身を貼り付ける。
    </p>

    <button id="save">保存</button>
    <span id="status"></span>

    <div id="queue">未送信のイベント: <span id="queue-count">-</span> 件</div>

    <!-- shared.js を import するので module で読み込む。 -->
    <script type="module" src="options.js"></script>
  </body>
</html>
